# release-scaffold.yml — myPKA scaffold release pipeline.  [AUTO-39]
# ---------------------------------------------------------------------------
# On a `v<semver>` scaffold tag:
#   build deterministic scaffold ZIP + per-version scaffold-manifest.json ->
#   ask the expansion-release edge function for signed UPLOAD urls -> PUT both
#   artifacts straight to Storage -> call the edge function to publish (verify
#   + upsert the discovery-index row, item_type 'mypka_scaffold') -> create a
#   GitHub Release.
#
# SECURITY (AUTO-36 §4): CI NEVER holds the Supabase service-role key. The
# edge function is the only service-role holder; CI talks only to the edge
# function with a shared secret, and uploads via short-lived signed upload
# URLs the function mints (those URLs need no service-role key to use).
# The scaffold ZIP is ~12.6 MB — too large to stream through an Edge Function
# request body — so the signed-upload-URL path is also a hard requirement,
# not just a security choice.
#
# The scaffold-manifest.json (per-file sha256 map) is the classifier the
# `mypka update` scaffold-merge depends on (AUTO-36 §5.6.1).
#
# Tom's Q2 decision: the existing public GitHub release flow STAYS — this
# pipeline adds the Storage-backed, IC-gated delivery path; it does not
# replace the public release. Both coexist.
#
# CREDENTIALS — repo secret required (workflow is INERT and fails fast at the
# guard step until it exists; it changes nothing meanwhile):
#   EXPANSION_RELEASE_SECRET   shared secret for the expansion-release fn
# SUPABASE_URL is a non-secret repo variable (or the default below).
# NO service-role key, NO DB credentials in CI.
#
# PREREQUISITE: the ai-library-packs bucket file_size_limit must be >= the
# scaffold ZIP size (~13 MB). It is currently 10 MB — Tom must raise it
# before the first scaffold release (see the AUTO-38/39 revision report).
#
# COCKPIT (consolidation ruling 2026-07-23, train 3): the Cockpit's live
# source is IN THIS REPO at Expansions/mypka-cockpit/ (the historical
# myICOR/mypka-cockpit repo is archived; the cross-repo sync machinery is
# retired). The `cockpit` job below builds and verifies the Cockpit from the
# in-repo source on every release — guards ported from the retired cockpit
# release-pack.yml: slug/version lockstep, no requires_scaffold_version,
# fresh web/dist build as a verification gate (dist is NEVER shipped; the
# scaffold carries source-shape, members build on install), deterministic
# source-shape pack built twice and compared (byte-stability proof), and the
# Expansions/.trusted-sources pin must match the in-repo expansion.yaml
# (pin refresh rides the same PR as any cockpit manifest change).
# The job also runs on pull_request (cockpit paths) and workflow_dispatch as
# a dry-run; the `release` job runs on version tags only.
#
# Tag format:  v<semver>     e.g.  v1.10.3
# ---------------------------------------------------------------------------
name: Release myPKA scaffold

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    paths:
      - 'Expansions/mypka-cockpit/**'
      - 'Expansions/.trusted-sources'
      - '.github/workflows/release-scaffold.yml'
  # Dry-run: builds + verifies the cockpit from in-repo source, no release.
  workflow_dispatch:

concurrency:
  group: release-scaffold-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write          # create the GitHub Release

env:
  SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://fgyukrumymzgsfeadvio.supabase.co' }}
  COCKPIT_SLUG: mypka-cockpit
  COCKPIT_DIR: Expansions/mypka-cockpit

jobs:
  cockpit:
    name: Cockpit build + guards (in-repo source)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.guards.outputs.version }}
      zip_sha256: ${{ steps.pack.outputs.zip_sha256 }}
      manifest_sha256: ${{ steps.guards.outputs.manifest_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guards — slug, version lockstep, gate removal, pin match
        id: guards
        run: |
          set -euo pipefail
          MANIFEST="$COCKPIT_DIR/expansion.yaml"
          MSLUG=$(awk -F': *' '/^slug:/ {gsub(/["'"'"']/,"",$2); print $2; exit}' "$MANIFEST")
          MV=$(awk -F': *' '/^version:/ {gsub(/["'"'"']/,"",$2); print $2; exit}' "$MANIFEST")
          [ "$MSLUG" = "$COCKPIT_SLUG" ] || { echo "::error::expansion.yaml slug '$MSLUG' != '$COCKPIT_SLUG'"; exit 1; }
          PV=$(python3 -c "import json;print(json.load(open('$COCKPIT_DIR/package.json'))['version'])")
          WV=$(python3 -c "import json;print(json.load(open('$COCKPIT_DIR/web/package.json'))['version'])")
          [ "$PV" = "$MV" ] || { echo "::error::package.json version '$PV' != expansion.yaml version '$MV'"; exit 1; }
          [ "$WV" = "$MV" ] || { echo "::error::web/package.json version '$WV' != expansion.yaml version '$MV'"; exit 1; }
          if grep -q '^requires_scaffold_version:' "$MANIFEST"; then
            echo "::error::expansion.yaml still carries requires_scaffold_version (removed by ruling s7f)"; exit 1
          fi
          # Build artifacts must never be tracked — the scaffold ships source-shape.
          TRACKED_ARTIFACTS=$(git ls-files -- "$COCKPIT_DIR/web/dist" "$COCKPIT_DIR/**/node_modules" | head -5)
          if [ -n "$TRACKED_ARTIFACTS" ]; then
            echo "::error::Build artifacts are git-tracked under $COCKPIT_DIR (must be source-shape):"
            echo "$TRACKED_ARTIFACTS"; exit 1
          fi
          # Pin guard: the shipped .trusted-sources mirror must pin exactly this
          # manifest. Any cockpit version/manifest change must refresh the pin
          # in the same PR — this closes the cross-repo pin gap permanently.
          MANIFEST_SHA=$(shasum -a 256 "$MANIFEST" | cut -d' ' -f1)
          if ! grep -qE "^${COCKPIT_SLUG}@${MV} sha256=${MANIFEST_SHA}$" Expansions/.trusted-sources; then
            echo "::error::Expansions/.trusted-sources has no pin '${COCKPIT_SLUG}@${MV} sha256=${MANIFEST_SHA}'."
            echo "::error::Refresh the cockpit pin in the same PR that changes expansion.yaml."
            grep "^${COCKPIT_SLUG}@" Expansions/.trusted-sources || echo "(no ${COCKPIT_SLUG} pin lines at all)"
            exit 1
          fi
          echo "version=$MV"                   >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$MANIFEST_SHA" >> "$GITHUB_OUTPUT"
          echo "Guards passed: slug=$COCKPIT_SLUG version=$MV lockstep OK, source-shape OK, pin matches ($MANIFEST_SHA)."

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Expansions/mypka-cockpit/web/package-lock.json

      - name: Build-verification gate — fresh web/dist must build clean
        run: |
          set -euo pipefail
          npm --prefix "$COCKPIT_DIR/web" ci
          npm --prefix "$COCKPIT_DIR/web" run build
          [ -f "$COCKPIT_DIR/web/dist/index.html" ] || { echo "::error::web/dist/index.html missing after build"; exit 1; }
          echo "web/dist built clean ($(find "$COCKPIT_DIR/web/dist" -type f | wc -l | tr -d ' ') files)."
          # The build must not touch any TRACKED file (dist/node_modules are ignored).
          if git status --porcelain -- "$COCKPIT_DIR" | grep .; then
            echo "::error::Building web/dist modified tracked files under $COCKPIT_DIR (see above)."; exit 1
          fi
          echo "NOTE: dist is a build gate only; the scaffold ships the cockpit source-shape (members build on install)."

      - name: Package deterministic source-shape pack (built twice, byte-stable)
        id: pack
        env:
          VERSION: ${{ steps.guards.outputs.version }}
        run: |
          set -euo pipefail
          build_pack() {
            # Exactly the committed tree at HEAD, rooted at the slug.
            # (Same deterministic recipe as the retired cockpit release-pack.yml
            #  / mypka-expansions build-pack.sh: git archive, fixed mtime,
            #  sorted entries, no extra metadata.)
            local out="$1" stage
            stage="$(mktemp -d)"
            git archive --format=tar --prefix="${COCKPIT_SLUG}/" "HEAD:${COCKPIT_DIR}" | tar -x -C "$stage"
            local fixed_mtime="202601010000.00"
            find "$stage/$COCKPIT_SLUG" -exec touch -t "$fixed_mtime" {} +
            rm -f "$out"
            ( cd "$stage" && find "$COCKPIT_SLUG" -type f -o -type d | LC_ALL=C sort | zip -X -9 "$out" -@ >/dev/null )
            rm -rf "$stage"
          }
          mkdir -p dist-cockpit
          ZIP="$(pwd)/dist-cockpit/${COCKPIT_SLUG}-v${VERSION}.zip"
          build_pack "$ZIP"
          build_pack "$(pwd)/dist-cockpit/rebuild-check.zip"
          SHA1_A=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)
          SHA1_B=$(shasum -a 256 "$(pwd)/dist-cockpit/rebuild-check.zip" | cut -d' ' -f1)
          [ "$SHA1_A" = "$SHA1_B" ] || { echo "::error::Pack build is not byte-stable ($SHA1_A != $SHA1_B)"; exit 1; }
          rm -f "$(pwd)/dist-cockpit/rebuild-check.zip"

          # Validator-style sanity checks on the artifact itself.
          BAD_ROOT=$(unzip -l "$ZIP" | awk 'NR>3 && NF>=4 {print $4}' | grep -v '^$' | grep -cv "^${COCKPIT_SLUG}/" || true)
          [ "$BAD_ROOT" = "0" ] || { echo "::error::Pack contains entries outside ${COCKPIT_SLUG}/ root"; exit 1; }
          ZV=$(unzip -p "$ZIP" "${COCKPIT_SLUG}/expansion.yaml" | awk -F': *' '/^version:/ {gsub(/["'"'"']/,"",$2); print $2; exit}')
          [ "$ZV" = "$VERSION" ] || { echo "::error::version inside pack ($ZV) != $VERSION"; exit 1; }
          ZS=$(unzip -p "$ZIP" "${COCKPIT_SLUG}/expansion.yaml" | awk -F': *' '/^slug:/ {gsub(/["'"'"']/,"",$2); print $2; exit}')
          [ "$ZS" = "$COCKPIT_SLUG" ] || { echo "::error::slug inside pack ($ZS) != ${COCKPIT_SLUG}"; exit 1; }

          ZIP_SHA=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)
          echo "zip=$ZIP"            >> "$GITHUB_OUTPUT"
          echo "zip_sha256=$ZIP_SHA" >> "$GITHUB_OUTPUT"
          echo "Packaged $(basename "$ZIP"): byte-stable, zip sha256=$ZIP_SHA"

      - name: Keep the pack as a provenance artifact
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-pack
          path: ${{ steps.pack.outputs.zip }}
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "### Cockpit v${{ steps.guards.outputs.version }} verified from in-repo source"
            echo "- Pack zip sha256 (byte-stable, built twice): \`${{ steps.pack.outputs.zip_sha256 }}\`"
            echo "- expansion.yaml sha256 (== shipped .trusted-sources pin): \`${{ steps.guards.outputs.manifest_sha256 }}\`"
            echo "- Distribution: bundled inside the scaffold, source-shape (no standalone channel)."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    # Version tags only — pull_request / workflow_dispatch runs are cockpit
    # verification dry-runs and must never publish anything.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: cockpit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (the tagged commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard — release secret present
        env:
          REL_SECRET: ${{ secrets.EXPANSION_RELEASE_SECRET }}
        run: |
          if [ -z "$REL_SECRET" ]; then
            echo "::error::Missing repo secret EXPANSION_RELEASE_SECRET."
            echo "::error::The scaffold release pipeline is inert until it is set."
            exit 1
          fi
          echo "Release secret present."

      - name: Parse tag → version
        id: tag
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not v<semver>"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing scaffold version $VERSION"

      - name: Guard — VERSION file matches tag
        env:
          TAG_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          if [ -f VERSION ]; then
            FV=$(tr -d '[:space:]' < VERSION)
            if [ "$FV" != "$TAG_VERSION" ]; then
              echo "::error::VERSION file ($FV) != tag version ($TAG_VERSION)"; exit 1
            fi
            echo "VERSION file matches tag."
          else
            echo "::warning::No VERSION file — skipping version-match guard."
          fi

      - name: Build scaffold ZIP + scaffold-manifest.json
        id: build
        run: |
          set -euo pipefail
          chmod +x scripts/build-scaffold-release.sh
          scripts/build-scaffold-release.sh "${{ steps.tag.outputs.version }}" dist

      - name: Request signed upload URLs from the edge function
        id: mint
        env:
          REL_SECRET: ${{ secrets.EXPANSION_RELEASE_SECRET }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          ZIP_KEY="scaffold/mypka-scaffold-v${VERSION}.zip"
          MAN_KEY="scaffold/mypka-scaffold-v${VERSION}-manifest.json"
          mint() {
            local key="$1"
            local http
            http=$(curl -sS -o /tmp/mint.json -w '%{http_code}' \
              -X POST "${SUPABASE_URL}/functions/v1/expansion-release" \
              -H "X-Release-Secret: ${REL_SECRET}" \
              -H "Content-Type: application/json" \
              -d "{\"action\":\"mint-upload-url\",\"object_key\":\"${key}\"}")
            if [ "$http" != "200" ]; then
              echo "::error::Could not mint upload URL for ${key} (HTTP $http):" >&2
              cat /tmp/mint.json >&2; echo >&2
              echo "::error::HTTP 409 = this version was already released; bump the version." >&2
              exit 1
            fi
            python3 -c 'import json;print(json.load(open("/tmp/mint.json"))["signed_url"])'
          }
          ZIP_URL=$(mint "$ZIP_KEY")
          MAN_URL=$(mint "$MAN_KEY")
          echo "zip_key=$ZIP_KEY"   >> "$GITHUB_OUTPUT"
          echo "man_key=$MAN_KEY"   >> "$GITHUB_OUTPUT"
          echo "zip_url=$ZIP_URL"   >> "$GITHUB_OUTPUT"
          echo "man_url=$MAN_URL"   >> "$GITHUB_OUTPUT"

      - name: Upload artifacts to Storage via signed URLs (no service-role key)
        run: |
          set -euo pipefail
          put() {
            local url="$1" file="$2" ctype="$3"
            local http
            http=$(curl -sS -o /tmp/up.out -w '%{http_code}' \
              -X PUT "${url}" -H "Content-Type: ${ctype}" --data-binary "@${file}")
            if [ "$http" != "200" ] && [ "$http" != "201" ]; then
              echo "::error::Upload failed for ${file} (HTTP $http):"; cat /tmp/up.out || true
              exit 1
            fi
          }
          put "${{ steps.mint.outputs.zip_url }}" "${{ steps.build.outputs.zip }}"      "application/zip"
          put "${{ steps.mint.outputs.man_url }}" "${{ steps.build.outputs.manifest }}" "application/json"
          echo "Uploaded scaffold ZIP + manifest."

      - name: Publish — verify upload + upsert discovery row
        env:
          REL_SECRET: ${{ secrets.EXPANSION_RELEASE_SECRET }}
          VERSION: ${{ steps.tag.outputs.version }}
          FILE_URL: ${{ steps.mint.outputs.zip_key }}
          MAN_KEY: ${{ steps.mint.outputs.man_key }}
          ZIP_SHA: ${{ steps.build.outputs.zip_sha256 }}
          ZIP_SIZE: ${{ steps.build.outputs.zip_size }}
          MANIFEST_SHA: ${{ steps.build.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/payload.json
          import json, os
          payload = {
              "action": "publish",
              "item_type": "mypka_scaffold",
              "slug": "mypka-system",
              "version": os.environ["VERSION"],
              "file_url": os.environ["FILE_URL"],
              "file_name": f'mypka-scaffold-v{os.environ["VERSION"]}.zip',
              "file_size_bytes": int(os.environ["ZIP_SIZE"]),
              "zip_sha256": os.environ["ZIP_SHA"],
              "config_json": {
                  "scaffold_manifest_sha256": os.environ["MANIFEST_SHA"],
                  "scaffold_manifest_key": os.environ["MAN_KEY"],
              },
          }
          print(json.dumps(payload))
          PY
          HTTP=$(curl -sS -o /tmp/fn.out -w '%{http_code}' \
            -X POST "${SUPABASE_URL}/functions/v1/expansion-release" \
            -H "X-Release-Secret: ${REL_SECRET}" \
            -H "Content-Type: application/json" \
            --data-binary "@/tmp/payload.json")
          echo "publish responded HTTP $HTTP:"; cat /tmp/fn.out; echo
          [ "$HTTP" = "200" ] || { echo "::error::Publish failed."; exit 1; }

      - name: Create GitHub Release (attach versioned + stable ZIP + manifest)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.tag.outputs.version }}
          ZIP: ${{ steps.build.outputs.zip }}
          MANIFEST: ${{ steps.build.outputs.manifest }}
          ZIP_SHA: ${{ steps.build.outputs.zip_sha256 }}
        run: |
          set -euo pipefail
          # Stable-named copy so `/releases/latest/download/mypka-scaffold-latest.zip`
          # always resolves to the newest scaffold (COU-265). Identical bytes to the
          # versioned asset — same sha256, just a fixed filename.
          LATEST_ZIP="$(dirname "$ZIP")/mypka-scaffold-latest.zip"
          cp "$ZIP" "$LATEST_ZIP"

          # --- User-facing release notes -------------------------------------
          # Release notes are for the PEOPLE downloading the scaffold, not for
          # CI debugging. NEVER put internal infra here: no Storage bucket
          # paths, no internal issue refs. Only the public sha256 (a legit
          # integrity hash) and the asset download links belong on this page.
          #
          # The body is the matching CHANGELOG.md section, extracted by version
          # header `## [<version>]`, so every release self-documents what
          # actually changed for the user.
          CHANGELOG_SECTION=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; next }
            capture && /^## \[/      { exit }
            capture                  { print }
          ' CHANGELOG.md | sed -e 's/^[[:space:]]*$//' )
          # Trim leading/trailing blank lines.
          CHANGELOG_SECTION=$(printf '%s\n' "$CHANGELOG_SECTION" \
            | sed -e :a -e '/^\n*$/{$d;N;ba}' -e '/./,$!d')
          if [ -z "$CHANGELOG_SECTION" ]; then
            CHANGELOG_SECTION="See [CHANGELOG.md](CHANGELOG.md) for the full list of changes in this release."
          fi

          NOTES="## myPKA scaffold v${VERSION}

          ${CHANGELOG_SECTION}

          ---

          ### Download

          - **Latest (stable URL):** [\`mypka-scaffold-latest.zip\`](https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/mypka-scaffold-latest.zip) — always resolves to the newest scaffold.
          - **This version (pinned):** the \`mypka-scaffold-v${VERSION}.zip\` asset attached below.

          Unzip it into a folder, open that folder in your LLM tool, and paste \`initialize yourself in this folder\` — see the [README](https://github.com/${GITHUB_REPOSITORY}/blob/main/README.md) for the full setup.

          ### Integrity

          - ZIP sha256: \`${ZIP_SHA}\`

          Full changelog: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)"

          gh release create "$TAG" "$ZIP" "$LATEST_ZIP" "$MANIFEST" \
            --title "myPKA scaffold v${VERSION}" \
            --notes "$NOTES" \
            || gh release upload "$TAG" "$ZIP" "$LATEST_ZIP" "$MANIFEST" --clobber

      - name: Summary
        run: |
          {
            echo "### myPKA scaffold v${{ steps.tag.outputs.version }} released"
            echo "- ZIP sha256: \`${{ steps.build.outputs.zip_sha256 }}\`"
            echo "- manifest sha256: \`${{ steps.build.outputs.manifest_sha256 }}\`"
            echo "- Storage key: \`${{ steps.mint.outputs.zip_key }}\`"
            echo "- Stable asset: \`mypka-scaffold-latest.zip\` (fixed-name copy)."
            echo "- CI held no service-role key (signed-upload-URL path)."
          } >> "$GITHUB_STEP_SUMMARY"
